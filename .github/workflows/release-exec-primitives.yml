name: release-exec-primitives

# Publishes @novaproto/exec-primitives to the public npm registry.
#
# Trigger: pushing a tag named exec-primitives-v<version> (for example
# exec-primitives-v0.1.0). Nothing else runs this workflow: no branch push, no
# other tag pattern, no manual dispatch. It publishes only packages/exec-primitives.
#
# Required repository secret (one-time, manual): NPM_TOKEN, an npm automation or
# granular access token that can publish public packages under the @novaproto
# scope. Add it under Settings > Secrets and variables > Actions > New repository
# secret before pushing the first tag. The publish step fails closed without it.
#
# Refusals, checked before anything is installed or built: the tag version must
# equal packages/exec-primitives/package.json "version", the manifest must have
# no "private" field, and publishConfig.access must be "public"
# (scripts/release-check.ts).
#
# No --provenance: `bun publish` in the pinned bun 1.3.14 has no such flag.
# Provenance would need `npm publish --provenance` and `id-token: write`.

on:
  push:
    tags:
      - "exec-primitives-v*"

permissions:
  contents: read

concurrency:
  group: release-exec-primitives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/exec-primitives
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Refuse unless the tag matches a publishable manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-check.ts

      - name: Install (frozen lockfile)
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck (src, tests, scripts)
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Pack (dry run) and confirm the entry point was built
        run: |
          set -euo pipefail
          test -f dist/src/index.js
          test -f dist/src/index.d.ts
          bun pm pack --dry-run

      - name: Publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_CONFIG_TOKEN:-}" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set; nothing was published."
            exit 1
          fi
          bun publish --access public
